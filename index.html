<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Corrida de Robôs</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="script.js"></script>
</head>
<body>
    <img src="assets/img/background.png" class="image-fundo">

  <div class="cards">
    <div class="card">Pontuação: 000</div>
    <div class="card">Fase: 1</div>
    <div class="card">Pedras: 0</div>
  </div>

  <div class="cenario">
    
    <div class="robo haxel"><img src="assets/img/resgate.png" alt=""></div>
    <div class="robo airon"><img src="assets/img/sumo.png" alt=""></div>
    <div class="robo optimus"><img src="assets/img/cabodeguerra.png" alt=""></div>
    <div class="robo walle"><img src="assets/img/viagemaocentro.png" alt=""></div>

    <div class="item estrela">⭐</div>
    <div class="item moeda">💰</div>
    <div class="item energia">⚡</div>
    <div class="item coracao">❤️</div>

    <div class="obstaculo pedra">🪨</div>
    <div class="obstaculo fogo">🔥</div>

    <div class="confete"></div>

  </div>

  <div class="botoes">
    <button class="btn iniciar">Iniciar</button>
    <button class="btn reiniciar">Reiniciar</button>
  </div>

</body>
</html>
